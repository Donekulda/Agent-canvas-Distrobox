<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>OpenHands Agent Canvas (distrobox)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#171a21"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bg)"/>
  <!-- canvas frame -->
  <rect x="24" y="28" width="80" height="64" rx="8" fill="none" stroke="#f5f6f8" stroke-opacity="0.85" stroke-width="4"/>
  <!-- agent graph on the canvas -->
  <g stroke="#ffd34d" stroke-width="4" stroke-linecap="round">
    <line x1="44" y1="48" x2="64" y2="72"/>
    <line x1="84" y1="48" x2="64" y2="72"/>
    <line x1="44" y1="48" x2="84" y2="48"/>
  </g>
  <g fill="#ffd34d">
    <circle cx="44" cy="48" r="8"/>
    <circle cx="84" cy="48" r="8"/>
  </g>
  <circle cx="64" cy="72" r="10" fill="#ffffff" stroke="#ffd34d" stroke-width="4"/>
  <!-- box base -->
  <path d="M40 100h48" stroke="#f5f6f8" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round"/>
</svg>
